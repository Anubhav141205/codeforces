<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Form</title>
</head>
<body>
    <h3 align="center">Employee Registration Form</h3>

    <form>
        <table align="center" cellpadding="4">
            <tr>
                <td>Title:</td>
                <td>
                    <input type="radio" name="title">Mr.
                    <input type="radio" name="title">Mrs.
                    <input type="radio" name="title">Ms.
                </td>
            </tr>
            <tr><td>First Name:</td><td><input type="text"></td></tr>
            <tr><td>Last Name:</td><td><input type="text"></td></tr>
            <tr><td>Mail Address1:</td><td><input type="text"></td></tr>
            <tr><td>Mail Address2:</td><td><input type="text"></td></tr>
            <tr><td>City:</td><td><input type="text"></td></tr>
            <tr>
                <td>State:</td>
                <td>
                    <select>
                        <option>Gujarat</option>
                        <option>Maharashtra</option>
                        <option>Tamil Nadu</option>
                    </select>
                </td>
            </tr>
            <tr><td>Zip:</td><td><input type="text"></td></tr>
            <tr><td>Upload Photo:</td><td><input type="file"></td></tr>
            <tr><td>Email:</td><td><input type="email"></td></tr>
            <tr><td>Mobile:</td><td><input type="text"></td></tr>
            <tr>
                <td>Languages Known:</td>
                <td>
                    <input type="checkbox">Gujarati
                    <input type="checkbox">Hindi
                    <input type="checkbox">English
                </td>
            </tr>
            <tr>
                <td>Additional Info:</td>
                <td><textarea rows="3" cols="25"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
