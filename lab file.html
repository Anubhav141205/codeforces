 <title>Alphabet Chart</title>
 <link rel="stylesheet" href="alphabet_chart.css">
</head>
<body>
 <h1>Clickable Alphabet Chart</h1>

<img id="displayed-image" src="example images/A.png" alt="Letter Image">
